name: Deploy Docs to GitHub Pages

on:
  # 在推送到 main 分支时触发
  push:
    branches:
      - main
  
  # 允许手动触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 允许一个并发部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      HARBOR_REGISTRY: mx-compoments.top:443
      HARBOR_PROJECT: mx-component
      HARBOR_REPOSITORY: mx-components-docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建文档
        run: pnpm build:docs

      - name: 安装 Harbor 自签证书
        run: |
          HARBOR_HOST=$(echo "${{ env.HARBOR_REGISTRY }}" | cut -d: -f1)
          # 安装证书到 Docker 客户端证书目录
          sudo mkdir -p /etc/docker/certs.d/${{ env.HARBOR_REGISTRY }}
          sudo mkdir -p /etc/docker/certs.d/${HARBOR_HOST}
          echo "${{ secrets.HARBOR_CA_CERT }}" | sudo tee /etc/docker/certs.d/${{ env.HARBOR_REGISTRY }}/ca.crt > /dev/null
          echo "${{ secrets.HARBOR_CA_CERT }}" | sudo tee /etc/docker/certs.d/${HARBOR_HOST}/ca.crt > /dev/null
          sudo chmod 644 /etc/docker/certs.d/${{ env.HARBOR_REGISTRY }}/ca.crt
          sudo chmod 644 /etc/docker/certs.d/${HARBOR_HOST}/ca.crt
          # 添加到系统 CA 证书
          echo "${{ secrets.HARBOR_CA_CERT }}" | sudo tee /usr/local/share/ca-certificates/harbor.crt > /dev/null
          sudo update-ca-certificates

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 配置 Buildx 构建器
        run: |
          # 获取构建器名称（去掉特殊字符）
          BUILDER_NAME=$(docker buildx ls | grep -v "^NAME" | head -1 | awk '{print $1}' | sed 's/\*//g' | tr -d ' ')
          if [ -z "${BUILDER_NAME}" ] || [[ "${BUILDER_NAME}" =~ [^a-zA-Z0-9._-] ]]; then
            BUILDER_NAME="harbor-builder"
          fi
          
          # 停止并删除现有构建器（如果存在）
          docker buildx stop ${BUILDER_NAME} 2>/dev/null || true
          docker buildx rm ${BUILDER_NAME} 2>/dev/null || true
          
          # 创建新的构建器，使用 network=host 模式
          docker buildx create \
            --name ${BUILDER_NAME} \
            --driver docker-container \
            --driver-opt image=moby/buildkit:latest \
            --driver-opt network=host \
            --use
          
          # 启动构建器
          docker buildx inspect ${BUILDER_NAME} --bootstrap

      - name: 将证书复制到 Buildx 构建器容器
        run: |
          # 获取构建器容器名称
          BUILDER_NAME=$(docker buildx ls | grep -v "^NAME" | head -1 | awk '{print $1}' | sed 's/\*//g' | tr -d ' ')
          if [ -z "${BUILDER_NAME}" ] || [[ "${BUILDER_NAME}" =~ [^a-zA-Z0-9._-] ]]; then
            BUILDER_NAME="harbor-builder"
          fi
          
          CONTAINER_NAME=$(docker ps -a --filter "ancestor=moby/buildkit:latest" --format "{{.Names}}" | head -1)
          if [ -z "${CONTAINER_NAME}" ]; then
            CONTAINER_NAME=$(docker ps -a --filter "name=buildx_buildkit_${BUILDER_NAME}" --format "{{.Names}}" | head -1)
          fi
          
          if [ -n "${CONTAINER_NAME}" ]; then
            HARBOR_HOST=$(echo "${{ env.HARBOR_REGISTRY }}" | cut -d: -f1)
            # 在构建器容器中创建证书目录并复制证书
            docker exec ${CONTAINER_NAME} mkdir -p /etc/docker/certs.d/${{ env.HARBOR_REGISTRY }}
            docker exec ${CONTAINER_NAME} mkdir -p /etc/docker/certs.d/${HARBOR_HOST}
            docker cp /etc/docker/certs.d/${{ env.HARBOR_REGISTRY }}/ca.crt ${CONTAINER_NAME}:/etc/docker/certs.d/${{ env.HARBOR_REGISTRY }}/ca.crt
            docker cp /etc/docker/certs.d/${HARBOR_HOST}/ca.crt ${CONTAINER_NAME}:/etc/docker/certs.d/${HARBOR_HOST}/ca.crt
            # 重启构建器容器使证书生效
            docker restart ${CONTAINER_NAME}
            sleep 5
          fi

      - name: 登录 Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: 构建并推送镜像到 Harbor
        run: |
          BUILDER_NAME=$(docker buildx ls | grep -v "^NAME" | head -1 | awk '{print $1}' | sed 's/\*//g' | tr -d ' ')
          if [ -z "${BUILDER_NAME}" ] || [[ "${BUILDER_NAME}" =~ [^a-zA-Z0-9._-] ]]; then
            BUILDER_NAME="harbor-builder"
          fi
          
          docker buildx build \
            --builder ${BUILDER_NAME} \
            --file Dockerfile.server \
            --push \
            --tag ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.HARBOR_REPOSITORY }}:latest \
            --tag ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.HARBOR_REPOSITORY }}:${{ github.sha }} \
            .

      - name: 清理服务器旧版本
        if: ${{ success() && env.SERVER_HOST }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER || 'root' }}
          port: ${{ env.SERVER_PORT || '22' }}
          password: ${{ env.SERVER_PASSWORD }}
          script: |
            mkdir -p /www/wwwroot/packages/docs/.vitepress/dist
            rm -rf /www/wwwroot/packages/docs/.vitepress/dist/*

      - name: 上传静态文件到服务器
        if: ${{ success() && env.SERVER_HOST }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER || 'root' }}
          port: ${{ env.SERVER_PORT || '22' }}
          password: ${{ env.SERVER_PASSWORD }}
          source: "packages/docs/.vitepress/dist"
          strip_components: 3
          target: "/www/wwwroot/packages/docs/.vitepress"

      - name: 配置 Pages
        uses: actions/configure-pages@v4

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/docs/.vitepress/dist

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
